<?xml version="1.0" encoding="UTF-8"?>
<!-- Takım yolu simülasyonu ve çarpışma uyarısı — gokhancoskun.com yazi serisi gorseli.
     <img> ile gomulur: renk tokenlari ve hareket-azaltma kurali burada tanimli. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"
     aria-labelledby="b a">
  <title id="b">Takım yolu simülasyonu ve çarpışma uyarısı</title>
  <desc id="a">Takım, yol boyunca ilerlerken bağlama elemanına yaklaşıyor ve simülasyon çarpışma uyarısı veriyor.</desc>
  <style>
    svg {
      --yuzey: #ffffff; --yuzey2: #f0ece4; --kenar: #7d7669; --ince: #d9d3c7;
      --metin: #413e38; --soluk: #5a564d; --marka: #a8492a; --ok: #186a3b;
      --uyari: #8a5300;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --yuzey: #1c1b16; --yuzey2: #25241d; --kenar: #7a7466; --ince: #3a3830;
        --metin: #f2efe7; --soluk: #a8a294; --marka: #e08a68; --ok: #66d19e;
        --uyari: #e8b45c;
      }
    }
    .kutu   { fill: var(--yuzey); stroke: var(--kenar); stroke-width: 2; }
    .dolu   { fill: var(--yuzey2); stroke: var(--kenar); stroke-width: 2; }
    .cizgi  { stroke: var(--kenar); stroke-width: 2; fill: none; }
    .ince   { stroke: var(--ince); stroke-width: 1.5; fill: none; }
    .marka  { fill: var(--marka); }
    .markac { stroke: var(--marka); stroke-width: 2.5; fill: none; }
    .okc    { stroke: var(--ok); stroke-width: 2.5; fill: none; }
    .yazi   { fill: var(--metin); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
    .kucuk  { fill: var(--soluk); font: 500 12px ui-sans-serif, system-ui, sans-serif; }
    .kod    { fill: var(--soluk); font: 12px ui-monospace, Menlo, Consolas, monospace; }

    .tk { animation: tk-git 6s linear infinite; }
    @keyframes tk-git {
      0%   { transform: translate(0,0); }
      40%  { transform: translate(230px, 0); }
      55%  { transform: translate(230px, 60px); }
      70%, 100% { transform: translate(330px, 60px); }
    }
    .carp { animation: carp-uyar 6s ease-in-out infinite; }
    @keyframes carp-uyar {
      0%        { opacity: 1; }
      10%, 64%  { opacity: 0; }
      74%, 100% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <!-- Kendi zemini: SVG ayri belge oldugu icin sayfanin temasini bilemez.
       Zemin olmazsa koyu tema metni acik sayfada okunmaz kaliyor. -->
  <rect width="100%" height="100%" fill="var(--yuzey)"/>
  <text class="yazi" x="40" y="34">Simülasyon — tezgâha göndermeden önce</text>

  <!-- Tabla ve parca -->
  <rect class="dolu" x="48" y="236" width="470" height="26" rx="3"/>
  <rect class="dolu" x="96" y="170" width="330" height="66" rx="3"/>

  <!-- Baglama elemani (mengene pabucu) -->
  <rect class="dolu" x="392" y="140" width="52" height="96" rx="4"/>
  <text class="kucuk" x="418" y="132" text-anchor="middle">bağlama</text>

  <!-- Takim yolu -->
  <path class="ince" d="M76 108h230v60h100" stroke-dasharray="5 5"/>

  <!-- Takim -->
  <g class="tk">
    <rect class="marka" x="62" y="64" width="28" height="44" rx="3"/>
    <path class="marka" d="M68 108h16l-8 14z"/>
  </g>

  <!-- Carpisma uyarisi -->
  <g class="carp">
    <circle cx="418" cy="168" r="30" fill="none" stroke="var(--marka)" stroke-width="4"/>
    <path d="M418 152v22" stroke="var(--marka)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="418" cy="184" r="3" fill="var(--marka)"/>
    <text class="yazi marka" x="460" y="174">Çarpışma!</text>
  </g>

  <text class="kucuk" x="48" y="292">Ekranda kırılan takım ucuzdur.</text>
  <text class="kucuk" x="560" y="240">Kontrol et:</text>
  <text class="kucuk" x="560" y="260">· bağlama</text>
  <text class="kucuk" x="560" y="278">· takım boyu</text>
  <text class="kucuk" x="560" y="296">· hızlı hareket</text>

</svg>
