<?xml version="1.0" encoding="UTF-8"?>
<!-- Cep boşaltma yolları ve ada bırakma — gokhancoskun.com yazi serisi gorseli.
     <img> ile gomulur: renk tokenlari ve hareket-azaltma kurali burada tanimli. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"
     aria-labelledby="b a">
  <title id="b">Cep boşaltma yolları ve ada bırakma</title>
  <desc id="a">Solda içten dışa spiral boşaltma yolu, sağda zigzag yol. Cebin ortasındaki ada işlenmeden bırakılıyor.</desc>
  <style>
    svg {
      --yuzey: #ffffff; --yuzey2: #f0ece4; --kenar: #7d7669; --ince: #d9d3c7;
      --metin: #413e38; --soluk: #5a564d; --marka: #a8492a; --ok: #186a3b;
      --uyari: #8a5300;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --yuzey: #1c1b16; --yuzey2: #25241d; --kenar: #7a7466; --ince: #3a3830;
        --metin: #f2efe7; --soluk: #a8a294; --marka: #e08a68; --ok: #66d19e;
        --uyari: #e8b45c;
      }
    }
    .kutu   { fill: var(--yuzey); stroke: var(--kenar); stroke-width: 2; }
    .dolu   { fill: var(--yuzey2); stroke: var(--kenar); stroke-width: 2; }
    .cizgi  { stroke: var(--kenar); stroke-width: 2; fill: none; }
    .ince   { stroke: var(--ince); stroke-width: 1.5; fill: none; }
    .marka  { fill: var(--marka); }
    .markac { stroke: var(--marka); stroke-width: 2.5; fill: none; }
    .okc    { stroke: var(--ok); stroke-width: 2.5; fill: none; }
    .yazi   { fill: var(--metin); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
    .kucuk  { fill: var(--soluk); font: 500 12px ui-sans-serif, system-ui, sans-serif; }
    .kod    { fill: var(--soluk); font: 12px ui-monospace, Menlo, Consolas, monospace; }

    .yol { stroke-dasharray: 900; animation: yol-ciz 6s ease-in-out infinite; }
    .yol2 { animation-delay: 0.6s; }
    @keyframes yol-ciz {
      0%        { stroke-dashoffset: 0; }
      8%        { stroke-dashoffset: 900; }
      62%, 100% { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <!-- Kendi zemini: SVG ayri belge oldugu icin sayfanin temasini bilemez.
       Zemin olmazsa koyu tema metni acik sayfada okunmaz kaliyor. -->
  <rect width="100%" height="100%" fill="var(--yuzey)"/>
  <text class="yazi" x="40" y="34">Spiral (içten dışa)</text>
  <rect class="dolu" x="48" y="56" width="290" height="210" rx="4"/>
  <path class="okc yol" fill="none"
        d="M193 208 L152 208 L152 172 L234 172 L234 208 L152 208
           M138 226 L138 152 L248 152 L248 226 L138 226
           M120 244 L120 132 L266 132 L266 244 L120 244
           M102 262 L102 112 L284 112 L284 262 L102 262"/>
  <!-- Ada -->
  <rect x="164" y="180" width="58" height="20" class="dolu"/>
  <text class="kucuk" x="193" y="195" text-anchor="middle">ada</text>
  <text class="kucuk" x="48" y="292">Yumuşak yön değişimi, takıma nazik.</text>

  <text class="yazi" x="400" y="34">Zigzag</text>
  <rect class="dolu" x="400" y="56" width="272" height="210" rx="4"/>
  <path class="okc yol yol2" fill="none"
        d="M414 74 H658 M658 100 H414 M414 126 H658 M658 152 H414
           M414 178 H658 M658 204 H414 M414 230 H658 M658 252 H414"/>
  <text class="kucuk" x="400" y="292">Hızlı, ama her dönüşte yön değişir.</text>

</svg>
