<?xml version="1.0" encoding="UTF-8"?>
<!-- Plaka üzerine parça yerleşimi (nesting) — gokhancoskun.com yazi serisi gorseli.
     <img> ile gomulur: renk tokenlari ve hareket-azaltma kurali burada tanimli. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img"
     aria-labelledby="b a">
  <title id="b">Plaka üzerine parça yerleşimi (nesting)</title>
  <desc id="a">Sol taraftaki parça listesi, sağdaki plakaya sırayla yerleşiyor; yerleşim sıkılaştıkça artan fire azalıyor.</desc>
  <style>
    svg {
      --yuzey: #ffffff; --yuzey2: #f0ece4; --kenar: #7d7669; --ince: #d9d3c7;
      --metin: #413e38; --soluk: #5a564d; --marka: #a8492a; --ok: #186a3b;
      --uyari: #8a5300;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --yuzey: #1c1b16; --yuzey2: #25241d; --kenar: #7a7466; --ince: #3a3830;
        --metin: #f2efe7; --soluk: #a8a294; --marka: #e08a68; --ok: #66d19e;
        --uyari: #e8b45c;
      }
    }
    .kutu   { fill: var(--yuzey); stroke: var(--kenar); stroke-width: 2; }
    .dolu   { fill: var(--yuzey2); stroke: var(--kenar); stroke-width: 2; }
    .cizgi  { stroke: var(--kenar); stroke-width: 2; fill: none; }
    .ince   { stroke: var(--ince); stroke-width: 1.5; fill: none; }
    .marka  { fill: var(--marka); }
    .markac { stroke: var(--marka); stroke-width: 2.5; fill: none; }
    .okc    { stroke: var(--ok); stroke-width: 2.5; fill: none; }
    .yazi   { fill: var(--metin); font: 600 14px ui-sans-serif, system-ui, sans-serif; }
    .kucuk  { fill: var(--soluk); font: 500 12px ui-sans-serif, system-ui, sans-serif; }
    .kod    { fill: var(--soluk); font: 12px ui-monospace, Menlo, Consolas, monospace; }

    .yerlesen { animation: yerles 7s ease-in-out infinite; }
    .y1 { animation-delay: 0.3s; } .y2 { animation-delay: 0.8s; }
    .y3 { animation-delay: 1.3s; } .y4 { animation-delay: 1.8s; }
    .y5 { animation-delay: 2.3s; } .y6 { animation-delay: 2.8s; }
    @keyframes yerles {
      0%        { opacity: 1; }
      6%        { opacity: 0; }
      16%, 100% { opacity: 1; }
    }
    .oran { animation: oran-say 7s ease-in-out infinite; }
    @keyframes oran-say { 0% { opacity: 1 } 22% { opacity: 0 } 44%,100% { opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <!-- Kendi zemini: SVG ayri belge oldugu icin sayfanin temasini bilemez.
       Zemin olmazsa koyu tema metni acik sayfada okunmaz kaliyor. -->
  <rect width="100%" height="100%" fill="var(--yuzey)"/>
  <text class="yazi" x="40" y="34">Parça listesi</text>
  <rect class="kutu" x="40" y="52" width="164" height="216" rx="6"/>
  <rect class="dolu" x="58" y="72"  width="60" height="40" rx="3"/>
  <text class="kucuk" x="128" y="97">×2</text>
  <rect class="dolu" x="58" y="128" width="90" height="30" rx="3"/>
  <text class="kucuk" x="158" y="148">×2</text>
  <rect class="dolu" x="58" y="174" width="44" height="44" rx="3"/>
  <text class="kucuk" x="112" y="200">×2</text>
  <text class="kucuk" x="58" y="248">6 parça</text>

  <!-- Plaka -->
  <text class="yazi" x="252" y="34">Plaka 2440 × 1220</text>
  <rect class="kutu" x="252" y="52" width="420" height="216" rx="4"/>

  <rect class="dolu yerlesen y1" x="264" y="64"  width="60" height="40" rx="3"/>
  <rect class="dolu yerlesen y2" x="330" y="64"  width="60" height="40" rx="3"/>
  <rect class="dolu yerlesen y3" x="396" y="64"  width="90" height="30" rx="3"/>
  <rect class="dolu yerlesen y4" x="492" y="64"  width="90" height="30" rx="3"/>
  <rect class="dolu yerlesen y5" x="264" y="112" width="44" height="44" rx="3"/>
  <rect class="dolu yerlesen y6" x="314" y="112" width="44" height="44" rx="3"/>

  <g class="oran">
    <text class="kucuk ok" x="264" y="196" fill="var(--ok)">Kullanım %78</text>
    <text class="kucuk" x="264" y="216">Fire, plakanın sağ alt bölgesinde toplandı —</text>
    <text class="kucuk" x="264" y="234">tek parça halinde kaldığı için tekrar kullanılabilir.</text>
  </g>
  <text class="kucuk" x="252" y="292">İyi nesting fireyi azaltmaz; fireyi KULLANILABİLİR bırakır.</text>

</svg>
