<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>Panel girişi — {{ profil.full_name }}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%238f3c1e'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='17' font-weight='700' fill='%23fff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/site.css?v={{ asset_version }}">
{% include "partials/tema_onyukleyici.html" %}
</head>
<body>
<div class="giris-sayfa">
  <main class="giris-kutu">
    <h1>Panel girişi</h1>
    <p style="color:var(--fg-mute);font-size:0.92rem;margin-bottom:1.5rem">
      {{ profil.full_name }} yönetim paneli
    </p>

    {% if hata %}
    <div class="uyari uyari-hata" role="alert" style="margin-bottom:1.25rem">{{ hata }}</div>
    {% endif %}

    <form class="form" method="post" action="/giris">
      <div class="alan">
        <label for="kullanici">Kullanıcı adı</label>
        <input type="text" id="kullanici" name="username" required
               autocomplete="username" autocapitalize="none" autofocus
               value="{{ eski_kullanici or '' }}">
      </div>

      <div class="alan">
        <label for="parola">Parola</label>
        <input type="password" id="parola" name="password" required
               autocomplete="current-password" minlength="6">
      </div>

      <div><button type="submit" class="dugme" style="width:100%">Giriş yap</button></div>
    </form>

    <p style="margin:1.5rem 0 0;font-size:0.86rem" class="metin">
      <a href="/">← Siteye dön</a>
    </p>
  </main>
</div>
</body>
</html>
