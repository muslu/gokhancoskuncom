# ==================================================================
# gokhancoskun.com — FastAPI (SSR blog) + panel.gokhancoskun.com
# HTTP/3 (QUIC) zorunlu · www -> apex 301 · Server header global ayardan
#
# Cache-Control tek noktadan basilir (`$cc` deseni): location icine
# `add_header` KONMAZ — add_header miras alinmaz, tek bir location-ici
# add_header o yanitta HSTS/CSP dahil tum baslıklari sessizce dusurur.
# ==================================================================

# --- Panel giris ucu icin rate limit bolgesi ---
limit_req_zone $binary_remote_addr zone=gc_giris:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=gc_api:10m rate=120r/m;

# --- Ortak proxy ayarlari ---
map $http_upgrade $gc_connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------
# HTTP -> HTTPS
# ------------------------------------------------------------------
server {
    listen 80;
    server_name gokhancoskun.com www.gokhancoskun.com panel.gokhancoskun.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ------------------------------------------------------------------
# www -> apex (HTTPS)
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name www.gokhancoskun.com;

    ssl_certificate     /etc/letsencrypt/live/gokhancoskun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gokhancoskun.com/privkey.pem;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    return 301 https://gokhancoskun.com$request_uri;
}

# ------------------------------------------------------------------
# apex — public site
# ------------------------------------------------------------------
server {
    # NOT: `reuseport` BILEREK YOK — bu sunucuda 443'un reuseport sahibi
    # muslu.org.conf. Ikinci bir blokta tekrarlanirsa nginx
    # "duplicate listen options for 0.0.0.0:443" ile aciliMAZ.
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name gokhancoskun.com;

    ssl_certificate     /etc/letsencrypt/live/gokhancoskun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gokhancoskun.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GcSSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    include snippets/mailautoconfig.conf;

    client_max_body_size 12m;

    # --- Alt-Svc degiskeni: sitemap disinda HTTP/3 duyurulur ---
    set $altsvc 'h3=":443"; ma=86400';
    # --- Cache-Control tek noktadan; location'lar yalnizca $cc'yi degistirir ---
    set $cc '';

    # --- Arka ucun kopyalarini gizle: bu basliklarin TEK sahibi nginx ---
    # (location icinde tanimlanirsa miras alinan liste tumuyle ezilir)
    proxy_hide_header Cache-Control;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;

    # ---------- Statik varliklar ----------
    location /static/ {
        alias /opt/gokhancoskun/static/;
        access_log off;
        # Surum sorgu dizesiyle geldigi icin uzun sureli, ama immutable degil
        set $cc "public, max-age=2592000";
        try_files $uri =404;
    }

    location /media/ {
        alias /opt/gokhancoskun/media/;
        access_log off;
        set $cc "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---------- Sitemap: HTTP/3 duyurusu ALMAZ ----------
    # Arama motoru fetcher'lari bu dosyayi izole ceker; Alt-Svc gormeyen
    # istemci QUIC'e hic gecmez. Bos deger => nginx header'i hic basmaz.
    location = /sitemap.xml {
        set $altsvc '';
        set $cc "public, max-age=3600";
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        set $cc "public, max-age=86400";
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # RSS kaldirildi — /rss.xml artik 410 doner (301 degil: kaynak kalici olarak yok)
    location = /rss.xml { return 410; }

    # ---------- Panel apex'te sunulmaz ----------
    location /panel { return 301 https://panel.gokhancoskun.com$request_uri; }
    location /giris { return 301 https://panel.gokhancoskun.com/giris; }
    location /api/   { return 404; }

    # ---------- Bilinen tarama yollari ----------
    location ~ /\.(git|env|svn|hg) { deny all; access_log off; log_not_found off; }
    location ~* \.(sql|bak|old|swp|ini|log)$ { deny all; access_log off; }
    location ~* ^/(wp-admin|wp-login|xmlrpc|phpmyadmin|\.well-known/acme-challenge/\.\.) {
        deny all; access_log off;
    }

    # ---------- Uygulama ----------
    location / {
        set $cc "public, max-age=0, must-revalidate";
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gc_connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # --- Basliklar: TEK yerde, hepsi always ---
    add_header Alt-Svc $altsvc always;
    add_header Cache-Control $cc always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ------------------------------------------------------------------
# panel.gokhancoskun.com — yonetim paneli + API
# ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name panel.gokhancoskun.com;

    # NOT: certbot ile panel sertifikasi alinana kadar apex sertifikasi
    # kullanilir; tarayici alan adi uyusmazligi uyarisi verir.
    # deploy/scripts/panel-ssl.sh calistirildiginda bu iki satir guncellenir.
    ssl_certificate     /etc/letsencrypt/live/panel.gokhancoskun.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.gokhancoskun.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:GcPanelSSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    client_max_body_size 12m;

    set $cc '';

    # --- Arka ucun kopyalarini gizle: bu basliklarin TEK sahibi nginx ---
    # (location icinde tanimlanirsa miras alinan liste tumuyle ezilir)
    proxy_hide_header Cache-Control;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;

    location /static/ {
        alias /opt/gokhancoskun/static/;
        access_log off;
        set $cc "public, max-age=2592000";
        try_files $uri =404;
    }

    location /media/ {
        alias /opt/gokhancoskun/media/;
        access_log off;
        set $cc "public, max-age=2592000";
        try_files $uri =404;
    }

    # ---------- Giris ucu: sikilastirilmis rate limit ----------
    location = /giris {
        limit_req zone=gc_giris burst=5 nodelay;
        set $cc "no-store";
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- API ----------
    location /api/ {
        limit_req zone=gc_api burst=30 nodelay;
        set $cc "no-store";
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ /\.(git|env|svn|hg) { deny all; access_log off; log_not_found off; }

    location / {
        set $cc "no-store";
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Panel indekslenmez
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Cache-Control $cc always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
}
